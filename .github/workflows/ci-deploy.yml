name: Check game and deploy website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check and build game
        run: npm run build
      - name: Deploy whatifhk.com after checks pass
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          DEPLOY_HOOK: ${{ secrets.WHATIFHK_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo '::error::WHATIFHK_DEPLOY_HOOK is not configured; game checked but production was not triggered.'
            exit 1
          fi
          curl --fail --silent --show-error --retry 2 --max-time 30 \
            --request POST "$DEPLOY_HOOK" --output /tmp/deploy-response.json
          echo 'Vercel deployment requested. The Vercel build checks both repositories before publishing.' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify the game commit is live
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: node scripts/wait-for-deploy.mjs "$GITHUB_SHA"
